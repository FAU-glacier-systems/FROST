name: tests

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Use HTTPS for github.com (igm's igm-doc submodule is an SSH URL
          the runner has no key for)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy xarray dash rioxarray utm pyvista gstools netCDF4 pyyaml pytest
          pip install "git+https://github.com/instructed-glacier-model/igm@v3.0.1"

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v
