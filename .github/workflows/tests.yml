name: tests

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        # --no-deps: install setup.py's package metadata only, skip its
        # install_requires (which includes dash/pyvista - unused by this
        # suite, see tests/test_smoke.py docstring) and igm (drags in full
        # GPU TensorFlow plus unused CUDA wheels). Install just the trimmed
        # set this suite actually needs instead.
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install numpy==1.26.4 scipy==1.15.3 matplotlib==3.10.7 plotly==6.3.0 \
                      rioxarray==0.18.1 utm==0.8.1 gstools==1.7.0 netCDF4==1.6.0 \
                      PyYAML==6.0.3 pytest==9.1.1

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v
