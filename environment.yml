name: igm32-frost
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip:
    # Installs the frost package itself plus everything in setup.py's
    # install_requires/dev extra - see setup.py for the actual dependency
    # list and pinned versions, kept there so there's a single source of
    # truth instead of duplicating it here.
    - -e .[dev]
    # igm is a git source, not a normal PyPI release, so it can't live in
    # setup.py's install_requires - pinned to IGM 3.3.0 (2026-11-13; the
    # retraining rules of igm_wrapper.RETRAIN_RULES need its adaptive_time).
    # FROST v2.0 was run with 33c583ca (v3.2.1 plus 5 commits on main).
    # v3-dev also needs a one-line fix not yet in IGM upstream: igm_run reads
    # processes.iceflow...fp16_inference in every run, so runs without ice
    # flow (the OGGM-shop download) fail; local branch frost/v3.3.0.
    - git+https://github.com/instructed-glacier-model/igm@2d44578e4f4cef381de491b07a25c39172e56896
