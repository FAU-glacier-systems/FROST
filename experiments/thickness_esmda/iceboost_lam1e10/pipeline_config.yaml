experiment_name: "thickness_esmda/iceboost_lam1e10"  # = this folder; results in data/results/thickness_esmda/iceboost_lam1e10
rgi_id: None
smb_model: "ELA"
pipeline_steps:
  download: true
  inversion: true
  calibrate: true
download:
  oggm_shop: true
  thickness_product: iceboost
  velocity_product: millan    # millan (Millan et al. 2022) or itslive (ITS_LIVE v2)
  hugonnet: true
  year_interval: 20
  target_resolution: None
  zone_letter: "N"
  hugonnet_directory: 'data/raw/hugonnet/11_rgi60_2000-01-01_2020-01-01'

EnKF:
  seed: 1
  inflation: 1
  ensemble_size: 36
  iterations: 6
  init_offset: 0
  elev_band_height: 50
  forward_parallel: true
  synthetic: false
  method: esmda                    # ES-MDA: observation error x iterations per iteration
  monitor_plots: latest
  max_velbar: 1000                 # cap of the depth-averaged speed (m/yr) in the forward runs, as alps_TI_projections
  model_error: 0.0
  smb_prior_mean:
    ela: 3144
    abl_grad: 7.55
    acc_grad: 3.09

  smb_prior_std:
    ela: 498
    abl_grad: 9.04
    acc_grad: 3.39


