experiment_name: "central_europe_retrain"  # = this folder; results in data/results/central_europe_retrain
rgi_id: None
smb_model: "ELA"
pipeline_steps:
  download: true
  inversion: true
  calibrate: true
download:
  oggm_shop: true
  thickness_product: iceboost  # iceboost (IceBoost v2.0) or millan (Millan et al. 2022)
  velocity_product: itslive        # itslive (ITS_LIVE v2) or millan (Millan et al. 2022)
  velocity_year: null             # itslive: null for the 2014-2022 composite, else an annual mosaic
  hugonnet: true
  year_interval: 20
  target_resolution: None
  min_resolution: 50              # coarsen OGGM grids finer than 50 m (25 m on small glaciers: 6-8x more time steps); coarser grids are kept
  zone_letter: "N"
  hugonnet_directory: 'data/raw/hugonnet/11_rgi60_2000-01-01_2020-01-01'

EnKF:
  seed: 1
  inflation: 1
  ensemble_size: 32               # two full waves of 16 forward workers (36 left 12 idle in a third wave)
  iterations: 4                   # ES-MDA; Aletsch misfit flat after iteration 2
  init_offset: 0
  elev_band_height: 50
  forward_parallel: true
  synthetic: false
  method: esmda                    # ES-MDA: observation error x iterations per iteration
  monitor_plots: latest
  max_velbar: 1000                 # cap of the depth-averaged speed (m/yr) in the forward runs, as alps_TI_projections
  emulator_retrain: true           # retrain the emulator in the forward runs (300 at the start; 20 every step, or 5 every 5 where 5 steps < 0.9 yr: igm_wrapper.retrain_schedule); the inversion stays frozen
  forward_workers: 8               # 16 retraining workers ran out of host memory or stalled in XLA compiles (2026-10-23)
  model_error: 0.5                 # m/yr on the band means, as ContinuIX (0 collapsed the Aletsch posterior)
  glacier_wide_dhdt: false         # Hugonnet glacier-wide dh/dt: off, the band covariance (absolute long-range sills) already constrains the glacier mean
  smb_prior_mean:
    ela: 3144
    abl_grad: 7.55
    acc_grad: 3.09

  smb_prior_std:
    ela: 498
    abl_grad: 9.04
    acc_grad: 3.39


