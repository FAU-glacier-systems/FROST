# FROST for ContinuIX WP2/WP3 (https://github.com/ContinuIX/ContinuIX-1)
# 50 m test: config.yml with G01 (100 m) and S01 (25 m) on the 50 m grid of
# the other glaciers, in its own results folder (tasks_res50.txt: EXP01
# G01, S01). Switch them if the fit is no worse (S01: against its truth).
data_dir: "data/raw/continuix"     # unzipped Zenodo record 10.5281/zenodo.21401808
# EXP02 raw GeoTIFFs and shapefiles as netCDF on the EXP01 grid
# (frost.preprocess.continuix_raw, step 'raw' of run_continuix.py)
exp02_dir: "data/results/continuix/EXP02_input"
results_dir: "data/results/continuix/res50"
method: "method01"                 # EXP##_G##_<method>.nc
resolution: 50                     # model grid (m); coarser ContinuIX grids are kept
smb_model: "ELA"
# provided THK fixed, sliding (tau_ref) inverted; params_inversion.yaml
# inverts the thickness from an SIA start instead
params_inversion: "params_inversion_tau.yaml"
# velocities are always provided; slow glaciers (G04: 99th percentile
# 8.7 m/yr) must not be treated as missing data
min_velocity_p99: 1.0

EnKF:
  seed: 6
  inflation: 1
  ensemble_size: 36
  iterations: 6
  init_offset: 0
  elev_band_height: 50
  forward_parallel: true
  synthetic: false
  # 1-sigma model error of the band-mean dh/dt (m/yr), added to every band:
  # ContinuIX gives no usable dh/dt uncertainty, and the measurement error
  # alone averages down to cm/yr per band, so the 3-parameter SMB overfits
  model_error: 0.5

  # ELA prior: median ice elevation, a third of the elevation range as std
  # (continuix.smb_prior)
  smb_prior_mean:
    abl_grad: 7.55
    acc_grad: 3.09
  smb_prior_std:
    abl_grad: 9.04
    acc_grad: 3.39

# Per-glacier settings, merged over the ones above
glaciers:
  G01:
    # ~330k ice cells at 50 m; 16 workers would not fit the A40 (G05 at
    # 25 m, 126k cells: 22-35 GB with 16 workers)
    EnKF:
      forward_workers: 8
  # model_error = 0.5 * sqrt(chi2/n) of the 0.5 m/yr run (6 Oct): G03 6.5,
  # G05 8.6; the others are 0.15-2.3
  G03:
    EnKF:
      model_error: 1.3
  G05:
    EnKF:
      model_error: 1.5
