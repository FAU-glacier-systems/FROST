# @package _global_
# inversion_thickness: as joint_s50 (thk + tau_ref, IceBoost prior std 50 m)
# plus mass conservation: gaussian misfit of IGM's divflux against
# divfluxobs = SMB - Hugonnet dh/dt (2015-2019, the ITS_LIVE years, on the
# surface of the velocity year), std 2 m ice/yr. SMB: GLAMOS band balances: DIAGNOSTIC ONLY (what geometry would GLAMOS need?), not for production.
# divfluxobs is written by run.py (frost: divflux_obs).
# thk optimised as log10(thk) (2026-11-11): in metres the step of L-BFGS was
# set by the stiff tau_ref directions and thk moved by cm in 500 iterations.
assimilations:
  field_inversion:
    objective:
      misfit:
      - components:
        - uvelsurf
        - vvelsurf
        kind: huber
        name: velsurf
        obs:
        - uvelsurfobs
        - vvelsurfobs
        std: 1.0
      - components:
        - thk
        kind: gaussian
        name: thk
        obs:
        - thkprior
        std: 50.0
      - name: divflux
        kind: gaussian
        components:
        - divflux
        obs:
        - divfluxobs
        std: 2.0
      regularization:
      - lam: 10000000000.0
        name: tau_ref
        penalty: squared_laplacian
      - lam: 1000000.0
        name: thk
        penalty: squared_laplacian
        ref: usurf
    optimization:
      retrain_iter: 0
    output:
      vars_to_save:
      - usurf
      - thk
      - topg
      - icemask
      - tau_ref
      - velbase_mag
      - velsurf_mag
      - velsurfobs_mag
      - thkprior
    use_existing_thk: true
    variables:
    - lower_bound: 0.0
      mask: icemask
      name: thk
      transform: log10
      upper_bound: 1500.0
    - lower_bound: 0.05
      mask: icemask
      name: tau_ref
      transform: log10
      upper_bound: 2.0
defaults:
- override /inputs:
  - local
- override /assimilations:
  - field_inversion
- override /processes:
  - iceflow
- override /outputs: []
frost:
  inversion_year: velocity
  min_velocity_p99: 3.0
  thk_start: product_2000
  divflux_obs: glamos
hydra:
  run:
    dir: outputs/inversion
processes:
  iceflow:
    method: unified
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    physics:
      sliding:
        tau_ref: 0.213
        u_ref: 100.0
    unified:
      display:
        print_cost: true
      inputs:
      - thk
      - usurf
      - arrhenius
      - tau_ref
      - dX
      line_search: hager-zhang
      mapping: network
      nbit: 0
      nbit_init: 0
      nbit_warmup: -1
      network:
        pretrained: true
        pretrained_path: dahunet_mini.keras
      optimizer: lbfgs
      retrain_freq: 0
