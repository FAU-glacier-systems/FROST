# @package _global_
core:
  url_data: ''
defaults:
- override /inputs:
  - local
- override /processes:
  - iceflow
  - thk
- override /assimilations:
  - field_inversion
- override /outputs: []
inputs:
  local:
    filename: input.nc
processes:
  iceflow:
    method: unified
    physics:
      sliding:
        u_ref: 100.0
        # tau_ref = slidingco * u_ref^(1/m); m = physics.sliding.exponent (3.0 default).
        # 0.045 was the old init_slidingco value: 0.045 * 100^(1/3) = 0.208872
        tau_ref: 0.208872
    unified:
      network:
        pretrained: true
assimilations:
  field_inversion:
    variables:
    - { name: thk, transform: identity, lower_bound: 0.0, upper_bound: 1000.0, mask: icemask }
    - { name: usurf, transform: identity, mask: icemask }
    objective:
      misfit:
      - { name: thk, kind: gaussian, components: [thk], obs: [thkobs], std: 1.0 }
      - { name: usurf, kind: gaussian, components: [usurf], obs: [usurfobs], std: 0.3 }
      - { name: velsurf, kind: gaussian, components: [uvelsurf, vvelsurf], obs: [uvelsurfobs, vvelsurfobs], std: 0.25 }
      regularization:
      - { name: thk, penalty: squared_laplacian, lam: 1000000.0 }
    optimization:
      nbitmax: 100
      retrain_iter: 5
    output:
      freq: 100
      vars_to_save:
      - usurf
      - thk
      - topg
      - icemask
      - velbase_mag
      - velsurf_mag
      - velsurfobs_mag
      - divflux
outputs: {}
